services:
  - type: web
    name: bbn
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /*.js
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
    routes:
      - type: rewrite
        source: /en/news/*
        destination: /en/index.html
      - type: rewrite
        source: /pt/news/*
        destination: /pt/index.html
      - type: rewrite
        source: /en/tag/*
        destination: /en/index.html
      - type: rewrite
        source: /pt/tag/*
        destination: /pt/index.html
      - type: rewrite
        source: /en/region/*
        destination: /en/index.html
      - type: rewrite
        source: /pt/regiao/*
        destination: /pt/index.html
