services:
  - type: web
    name: bbn
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co https://api.coinbase.com https://api.kraken.com https://api.binance.com https://www.google-analytics.com https://region1.google-analytics.com https://www.clarity.ms https://*.clarity.ms; frame-ancestors 'none'; base-uri 'self'; object-src 'none'
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /*.js
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
    routes:
      - type: rewrite
        source: /en/news/*
        destination: /en/index.html
      - type: rewrite
        source: /pt/news/*
        destination: /pt/index.html
      - type: rewrite
        source: /en/tag/*
        destination: /en/index.html
      - type: rewrite
        source: /pt/tag/*
        destination: /pt/index.html
      - type: rewrite
        source: /en/region/*
        destination: /en/index.html
      - type: rewrite
        source: /pt/regiao/*
        destination: /pt/index.html
