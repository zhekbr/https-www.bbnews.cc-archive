name: BBN Breaking News Pipeline

on:
  schedule:
    # Roda automaticamente a cada 15 minutos
    - cron: '*/6 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo teste (não grava no Supabase nem consome Groq)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: bbn-news-pipeline
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run BBN Breaking News Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_MODEL: openai/gpt-oss-120b
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/bbn-pipeline.mjs
