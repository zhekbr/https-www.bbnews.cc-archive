<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBN – Bitcoin Brasil News</title>
  <meta name="description" content="Real-time Bitcoin and geopolitics news. Breaking stories from global markets, powered by Nostr.">
  <meta property="og:title" content="BBN – Bitcoin Brasil News">
  <meta property="og:description" content="Real-time Bitcoin and geopolitics news. Breaking stories from global markets, powered by Nostr.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{BASE_URL}}/">
  <meta property="og:image" content="{{BASE_URL}}/assets/og-default.png">
  <meta property="og:site_name" content="BBN – Bitcoin Brasil News">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BBN – Bitcoin Brasil News">
  <meta name="twitter:description" content="Real-time Bitcoin and geopolitics news. Breaking stories from global markets, powered by Nostr.">
  <meta name="twitter:image" content="{{BASE_URL}}/assets/og-default.png">
  <link rel="canonical" href="{{BASE_URL}}/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://relay.damus.io" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Sora:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/style.css?v=1.9">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WWVSBWXE1T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WWVSBWXE1T');
  </script>
</head>

<body>
  <header>
    <div class="logo-lockup" onclick="goHome()" style="cursor: pointer" title="Back to Home">
      <div class="logo">BBN</div>
      <div class="logo-eyebrow">Bitcoin Brasil News</div>
    </div>
    <div class="header-meta">
      <div class="live-badge"><span class="live-dot"></span>Live</div>
      <a id="btc-blofin-widget" class="btc-widget" href="https://blofin.com/register?referral_code=LEOAci"
        target="_blank" rel="noopener noreferrer" title="Open an account on BloFin">
        <span class="btc-label">BTC/USDT</span>
        <span class="btc-sep">|</span>
        <span id="btc-price">Fetching...</span>
      </a>
      <div class="date-line" id="date-display"></div>
    </div>
  </header>
  <nav class="nav-bar">
    <a href="/" onclick="event.preventDefault(); goHome()" class="nav-link active">Home</a>
    <a href="/archive" onclick="event.preventDefault(); goArchive()" class="nav-link">Archive</a>
  </nav>
  <div class="ticker-wrap">
    <div class="ticker-belt" id="ticker-belt"></div>
  </div>
  <div id="page-home" class="active">
    <div id="filter-container">
{{FILTERS}}
    </div>
    <div class="section-label">── Latest news</div>
    <div class="scroll-row" id="row-0">
      <div class="scroll-track rev" id="tr0"></div>
    </div>
    <div class="expanded-panel" id="panel-0"></div>
    <div class="scroll-row" id="row-1">
      <div class="scroll-track slow" id="tr1"></div>
    </div>
    <div class="expanded-panel" id="panel-1"></div>
    <div class="scroll-row" id="row-2">
      <div class="scroll-track rev" id="tr2"></div>
    </div>
    <div class="expanded-panel" id="panel-2"></div>
    <div class="mais-noticias-container">
      <a href="/archive" onclick="event.preventDefault(); goArchive()" class="panel-btn btn-primary">More news</a>
    </div>

    <!-- SEO: Pre-rendered article index for crawlers -->
    <noscript>
      <div class="seo-article-index" style="padding:2rem;">
        <h2>Latest Articles</h2>
        <ul>
{{ARTICLE_INDEX}}
        </ul>
      </div>
    </noscript>
  </div>


  <div id="page-article">
    <div class="article-wrap" id="article-container"></div>
  </div>

  <footer>
    <div class="footer-logo">BBN</div>
    <div class="footer-copy">Bitcoin Brasil News &nbsp;·&nbsp; Updated daily &nbsp;·&nbsp; © 2025</div>
  </footer>
  <script src="/app.js?v=1.19" defer></script>
</body>

</html>
