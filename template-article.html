<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | BBN – Bitcoin Brasil News</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{OG_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:site_name" content="BBN – Bitcoin Brasil News">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{OG_TITLE}}">
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  <!-- Article meta tags -->
  <meta name="author" content="BBN – Bitcoin Brasil News">
  <meta name="article:published_time" content="{{PUBLISHED_TIME}}">
  <meta name="article:section" content="{{ARTICLE_CATEGORY}}">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <link rel="canonical" href="{{OG_URL}}">
  <!-- Preconnects -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.google-analytics.com">
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="dns-prefetch" href="https://www.google-analytics.com">
  <!-- Google Fonts: async non-blocking load -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Sora:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Sora:wght@400;500;700&display=swap"></noscript>
  <!-- Favicon & Manifest -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F7931A">
  <link rel="stylesheet" href="/style.css?v=1.9">
  <!-- JSON-LD: NewsArticle -->
  <script type="application/ld+json">
  {{JSON_LD_ARTICLE}}
  </script>
  <!-- Google Analytics 4 (deferred) -->
  <script>
    window.addEventListener('load', function() {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-WWVSBWXE1T';
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WWVSBWXE1T');
    });
  </script>
</head>

<body>
  <header>
    <div class="logo-lockup" onclick="goHome()" style="cursor: pointer" title="Back to Home">
      <div class="logo">BBN</div>
      <div class="logo-eyebrow">Bitcoin Brasil News</div>
    </div>
    <div class="header-meta">
      <div class="live-badge"><span class="live-dot"></span>Live</div>
      <a id="btc-blofin-widget" class="btc-widget" href="https://blofin.com/register?referral_code=LEOAci"
        target="_blank" rel="noopener noreferrer" title="Open an account on BloFin">
        <span class="btc-label">BTC/USDT</span>
        <span class="btc-sep">|</span>
        <span id="btc-price">Fetching...</span>
      </a>
      <div class="date-line" id="date-display"></div>
    </div>
  </header>
  <nav class="nav-bar">
    <a href="/" onclick="event.preventDefault(); goHome()" class="nav-link">Home</a>
    <a href="/archive" onclick="event.preventDefault(); goArchive()" class="nav-link">Archive</a>
  </nav>

  <main id="main-content">
  <div id="page-home">
    <div class="section-label">── Latest news</div>
    <div class="scroll-row" id="row-0">
      <div class="scroll-track rev" id="tr0"></div>
    </div>
    <div class="expanded-panel" id="panel-0"></div>
    <div class="scroll-row" id="row-1">
      <div class="scroll-track slow" id="tr1"></div>
    </div>
    <div class="expanded-panel" id="panel-1"></div>
    <div class="scroll-row" id="row-2">
      <div class="scroll-track rev" id="tr2"></div>
    </div>
    <div class="expanded-panel" id="panel-2"></div>
    <div class="mais-noticias-container">
      <a href="/archive" onclick="event.preventDefault(); goArchive()" class="panel-btn btn-primary">More news</a>
    </div>
  </div>

  <div id="page-article" class="active">
    <div class="article-wrap" id="article-container">
      <div class="article-breadcrumb">
        <a class="breadcrumb-home" href="/" onclick="event.preventDefault(); goHome()">BBN</a>
        <span>›</span>
        <span>{{BREADCRUMB}}</span>
      </div>
      <h1 class="article-title">{{ARTICLE_TITLE}}</h1>
      <hr class="article-divider">
      <div class="article-body">{{ARTICLE_BODY}}</div>
      <div style="margin-top:2.5rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;">
        {{SOURCE_BUTTON}}
        <a class="article-back-btn" href="/" onclick="event.preventDefault(); goHome()">← Back to news</a>
      </div>
    </div>
  </div>
  </main>

  <footer>
    <div class="footer-logo">BBN</div>
    <div class="footer-copy">Bitcoin Brasil News &nbsp;·&nbsp; Updated daily &nbsp;·&nbsp; © 2025 &nbsp;·&nbsp; <a href="/privacy" style="color:var(--orange);text-decoration:none;border-bottom:1px solid rgba(247,147,26,0.35);">Privacy Policy</a></div>
  </footer>
  <script src="/app.js?v=1.19" defer></script>
</body>

</html>
